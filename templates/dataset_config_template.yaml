# Defaults for new dataset workspaces; existing datasets use their saved config.
# Change values under these keys rather than renaming the keys.
project_info:
  # Import uses the new workspace name; set manually for preparation.
  dataset_id: ""
  source_doi: "" # Optional DOI of the paper describing the dataset; editable during creation
  source_url: "" # Optional URL of the dataset's database entry; editable during creation

# Input file names used from the first import check through workspace loading.
# Use the same configured sample-file names in every sample folder.
std_names:
  expmat: "Exp_data_UMIcounts.mtx"
  genes: "Genes.txt"
  cells: "Cells.csv"
  samples: "Samples.csv"

# Marker filter parameters
marker_filter_params:
  cell_type:
    min_score: 1.0
    min_genes: 25
    max_genes: 100
  cancer_type:
    min_score: 1.0
    min_genes: 25
    max_genes: 50

# Analysis Parameters
params:
  min_genes: 500
  target_sum: 100000
  log2_expr_threshold: 4
  max_marker_genes: 50
  pca_nv: 50
  seed: 3988
  resolutions: [0.1, 0.5, 1.0, 1.5]
  umap:
    spread: 5
    min_dist: 0.1
  de:
    num_genes: 100
    max_match_genes: 50
    min_marker_found: 20
